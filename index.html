<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistance Tech Wifi</title>
<meta name="description" content="Wi‑Fi zone, MikroTik, flashing et déblocage de téléphone, aide aux techniciens. Envoyez votre demande en ligne.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="page">
    <div class="top">
      <a class="brand" href="./"><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="bizName"></span></a>
      <div class="top-actions">
        <a class="btn small" href="suivi.html" data-t="trackLink"></a>
        <div class="lang" role="group" aria-label="Langue / Language">
          <button type="button" id="btnFr" aria-pressed="true">FR</button>
          <button type="button" id="btnEn" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
    <h1 data-t="title"></h1>
    <p class="lede" data-t="lede"></p>
  </header>

  <section id="stepServices">
    <div class="eyebrow" data-t="step1"></div>
    <h2 data-t="svcTitle"></h2>
    <div id="services" class="svc-groups"></div>
  </section>

  <section>
    <div class="eyebrow" data-t="step2"></div>
    <h2 data-t="formTitle"></h2>
    <form id="form" class="panel" novalidate>
      <div class="row">
        <label for="f-name"><span data-t="name"></span><input id="f-name" autocomplete="name" maxlength="100" required></label>
        <label for="f-phone"><span data-t="phone"></span><input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" required></label>
      </div>
      <div class="row">
        <label for="f-service"><span data-t="service"></span><select id="f-service" required></select></label>
        <label for="f-place"><span data-t="place"></span><input id="f-place" maxlength="120"></label>
      </div>
      <label for="f-device"><span data-t="device"></span><input id="f-device" maxlength="120"></label>
      <label for="f-desc"><span data-t="desc"></span><textarea id="f-desc" maxlength="2000" required></textarea></label>
      <fieldset>
        <legend data-t="how"></legend>
        <div class="radios">
          <label><input type="radio" name="how" id="how-remote" value="remote" checked><span data-t="remote"></span></label>
          <label><input type="radio" name="how" id="how-site" value="site"><span data-t="site"></span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend data-t="uses"></legend>
        <div class="radios">
          <label><input type="radio" name="uses" id="uses-phone" value="phone" checked><span data-t="usePhone"></span></label>
          <label><input type="radio" name="uses" id="uses-pc" value="computer"><span data-t="usePc"></span></label>
        </div>
      </fieldset>
      <div class="row">
        <label for="f-date"><span data-t="date"></span><input id="f-date" type="date"></label>
        <label for="f-time"><span data-t="time"></span><select id="f-time"></select></label>
      </div>
      <fieldset>
        <legend data-t="urgency"></legend>
        <div class="radios">
          <label><input type="radio" name="urg" id="urg-today" value="today"><span data-t="today"></span></label>
          <label><input type="radio" name="urg" id="urg-week" value="week" checked><span data-t="week"></span></label>
          <label><input type="radio" name="urg" id="urg-any" value="any"><span data-t="any"></span></label>
        </div>
      </fieldset>
      <p class="note" data-t="owner"></p>
      <p class="msg err" id="err" hidden></p>
      <button class="btn primary" type="submit" id="submitBtn" data-t="submit"></button>
    </form>

    <div class="panel" id="result" hidden>
      <p class="msg ok" data-t="savedTitle"></p>
      <div>
        <div class="note" data-t="yourCode"></div>
        <div class="code" id="resCode"></div>
      </div>
      <p class="note" data-t="savedText"></p>
      <a class="btn primary block" id="trackBtn" href="#" data-t="trackMine"></a>
      <a class="btn wa block" id="waBtn" href="#" target="_blank" rel="noopener" data-t="notifyWa"></a>
      <div class="btns">
        <button type="button" class="btn small" id="copyLink" data-t="copyLink"></button>
        <button type="button" class="btn small" id="again" data-t="again"></button>
      </div>
    </div>

    <div class="panel" id="fallback" hidden>
      <p class="msg err" data-t="saveFailed"></p>
      <a class="btn wa block" id="waFallback" href="#" target="_blank" rel="noopener" data-t="sendWa"></a>
      <pre class="box" id="fallbackMsg"></pre>
    </div>
  </section>

  <section id="reviewsSec" hidden>
    <div class="eyebrow" data-t="reviewsEyebrow"></div>
    <h2 data-t="reviewsTitle"></h2>
    <div class="reviews" id="reviews"></div>
  </section>

  <div class="contact">
    <span data-t="contact"></span>
    <span class="num waDisplay"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.76.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const A = APP, $ = U.$, h = U.h;
const T = {
fr:{title:"Besoin d'aide ? Envoyez votre demande.",lede:"Réseau entreprise (MikroTik, Cisco, LAN), Wi‑Fi zone & Starlink, flashing et déblocage de téléphone, aide aux techniciens. Remplissez le formulaire : vous recevez un code pour suivre votre demande, voir le prix et payer.",
trackLink:"Suivre ma demande",step1:"Étape 1",svcTitle:"Choisissez un service",step2:"Étape 2",formTitle:"Décrivez votre problème",
name:"Votre nom",phone:"Votre numéro WhatsApp",service:"Service",place:"Quartier / ville",device:"Appareil (marque et modèle)",desc:"Expliquez le problème",
how:"Intervention",remote:"À distance (AnyDesk / UltraViewer / WhatsApp)",site:"Sur place",uses:"Vous utilisez",usePhone:"Téléphone",usePc:"Ordinateur",
date:"Date souhaitée",time:"Heure souhaitée",anyTime:"N'importe quelle heure",urgency:"Urgence",today:"Aujourd'hui",week:"Cette semaine",any:"Pas pressé",
owner:"Pour le flashing, le déblocage et l'iCloud / Apple ID, il faut être le propriétaire du téléphone (boîte, facture ou pièce d'identité).",
submit:"Enregistrer ma demande",saving:"Enregistrement…",
savedTitle:"Votre demande est enregistrée.",yourCode:"Votre code de suivi",
savedText:"Gardez ce code. Sur la page de suivi, vous verrez le prix, comment payer, et vous pourrez envoyer votre reçu de paiement.",
trackMine:"Voir ma demande",notifyWa:"Prévenir sur WhatsApp",copyLink:"Copier le lien de suivi",copied:"Lien copié",again:"Nouvelle demande",
saveFailed:"La demande n'a pas pu être enregistrée (problème de connexion). Envoyez‑la plutôt sur WhatsApp :",sendWa:"Envoyer sur WhatsApp",
errReq:"Remplissez votre nom, votre numéro, le service et la description.",errMany:"Trop de demandes avec ce numéro. Réessayez dans une heure ou écrivez sur WhatsApp.",
reviewsEyebrow:"Avis clients",reviewsTitle:"Ils nous ont fait confiance",contact:"WhatsApp :",
m:{head:"Nouvelle demande",code:"Code",name:"Nom",phone:"Téléphone",service:"Service",place:"Lieu",device:"Appareil",how:"Intervention",uses:"Utilise",when:"Rendez-vous",at:"à",urg:"Urgence",desc:"Problème",track:"Suivi"}},
en:{title:"Need help? Send your request.",lede:"Business networks (MikroTik, Cisco, office LAN), Wi‑Fi zones & Starlink, phone flashing and unlocking, help for technicians. Fill in the form: you get a code to track your request, see the price and pay.",
trackLink:"Track my request",step1:"Step 1",svcTitle:"Choose a service",step2:"Step 2",formTitle:"Describe your problem",
name:"Your name",phone:"Your WhatsApp number",service:"Service",place:"Area / town",device:"Device (brand and model)",desc:"Explain the problem",
how:"Where",remote:"Remote (AnyDesk / UltraViewer / WhatsApp)",site:"On site",uses:"You are using",usePhone:"Phone",usePc:"Computer",
date:"Preferred date",time:"Preferred time",anyTime:"Any time",urgency:"Urgency",today:"Today",week:"This week",any:"No rush",
owner:"For flashing, unlocking and iCloud / Apple ID, you must be the phone's owner (box, receipt or ID).",
submit:"Save my request",saving:"Saving…",
savedTitle:"Your request is saved.",yourCode:"Your tracking code",
savedText:"Keep this code. On the tracking page you will see the price, how to pay, and you can send your payment receipt.",
trackMine:"View my request",notifyWa:"Notify on WhatsApp",copyLink:"Copy tracking link",copied:"Link copied",again:"New request",
saveFailed:"The request could not be saved (connection problem). Send it on WhatsApp instead:",sendWa:"Send on WhatsApp",
errReq:"Please fill in your name, number, service and description.",errMany:"Too many requests with this number. Try again in an hour or write on WhatsApp.",
reviewsEyebrow:"Customer reviews",reviewsTitle:"What customers say",contact:"WhatsApp:",
m:{head:"New request",code:"Code",name:"Name",phone:"Phone",service:"Service",place:"Place",device:"Device",how:"Where",uses:"Using",when:"Appointment",at:"at",urg:"Urgency",desc:"Problem",track:"Tracking"}}
};

let lang = U.store.get("lang", "fr") === "en" ? "en" : "fr";
let selected = "", last = null, reviews = [];
const sb = U.client(false);

document.querySelectorAll(".bizName").forEach(e => e.textContent = A.BUSINESS_NAME);
document.querySelectorAll(".waDisplay").forEach(e => e.textContent = A.WHATSAPP_DISPLAY);
try { const n = new Date(); $("f-date").min = new Date(n - n.getTimezoneOffset()*6e4).toISOString().slice(0,10); } catch(e){}

function radio(name){ const r = document.querySelector(`input[name="${name}"]:checked`); return r ? r.value : ""; }

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { const k = el.dataset.t; if (typeof t[k] === "string") el.textContent = t[k]; });
  $("btnFr").setAttribute("aria-pressed", lang === "fr"); $("btnEn").setAttribute("aria-pressed", lang === "en");
  const box = $("services"); box.replaceChildren();
  const groups = (A.GROUPS && A.GROUPS.length) ? A.GROUPS : [{id:null}];
  const card = s => h("button", {type:"button", class:"svc", "aria-pressed": String(selected === s.id),
      onclick: () => { selected = s.id; $("f-service").value = s.id; render(); $("f-name").focus(); }},
    h("span", {class:"tag"}, s.tag[lang]), h("b", null, s[lang][0]), h("span", null, s[lang][1]));
  groups.forEach(g => {
    const items = A.SERVICES.filter(s => (s.group || null) === g.id);
    if (!items.length) return;
    const grid = h("div", {class:"services"}, items.map(card));
    box.append(h("div", {class:"svc-group"}, g.id ? h("h3", {class:"group-head"}, (g.icon ? g.icon + " " : "") + g[lang]) : null, grid));
  });
  const sel = $("f-service"), cur = sel.value || selected;
  sel.replaceChildren(h("option", {value:""}, "—"));
  groups.forEach(g => {
    const items = A.SERVICES.filter(s => (s.group || null) === g.id);
    if (!items.length) return;
    if (g.id) sel.append(h("optgroup", {label: g[lang]}, items.map(s => h("option", {value:s.id}, s[lang][0]))));
    else items.forEach(s => sel.append(h("option", {value:s.id}, s[lang][0])));
  });
  sel.value = cur;
  const ts = $("f-time"), tc = ts.value;
  const opts = [h("option", {value:""}, t.anyTime)];
  for (let i = 7; i <= 22; i++) { const v = String(i).padStart(2,"0") + ":00"; opts.push(h("option", {value:v}, v)); }
  ts.replaceChildren(...opts); ts.value = tc;
  renderReviews();
  if (last) $("waBtn").href = U.waLink(A.WHATSAPP_NUMBER, buildMessage(last.data, last.code, last.token));
}
function setLang(l){ lang = l; U.store.set("lang", l); render(); }
$("btnFr").onclick = () => setLang("fr"); $("btnEn").onclick = () => setLang("en");
$("f-service").onchange = e => { selected = e.target.value; render(); };

function collect(){
  return { lang, name: $("f-name").value.trim(), phone: $("f-phone").value.trim(), service: $("f-service").value,
    place: $("f-place").value.trim(), device: $("f-device").value.trim(), description: $("f-desc").value.trim(),
    mode: radio("how"), uses: radio("uses"), pref_date: $("f-date").value, pref_time: $("f-time").value, urgency: radio("urg") };
}

function buildMessage(d, code, token){
  const t = T[lang], m = t.m;
  const lines = [`*${m.head}* – ${A.BUSINESS_NAME}`];
  if (code) lines.push(`${m.code}: ${code}`);
  lines.push(`${m.name}: ${d.name}`, `${m.phone}: ${d.phone}`, `${m.service}: ${U.service(d.service, lang)}`);
  if (d.place) lines.push(`${m.place}: ${d.place}`);
  if (d.device) lines.push(`${m.device}: ${d.device}`);
  if (d.pref_date || d.pref_time) lines.push(`${m.when}: ${U.date(d.pref_date)}${d.pref_date && d.pref_time ? " " + m.at + " " : ""}${d.pref_time}`);
  lines.push(`${m.how}: ${d.mode === "site" ? t.site : t.remote}`, `${m.uses}: ${d.uses === "computer" ? t.usePc : t.usePhone}`,
    `${m.urg}: ${t[d.urgency] || ""}`, `${m.desc}: ${d.description}`);
  if (code && token) lines.push("", `${m.track}: ${U.trackUrl(code, token)}`);
  return lines.join("\n");
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const t = T[lang], d = collect();
  if (!d.name || d.phone.replace(/\D/g, "").length < 6 || !d.service || !d.description) { $("err").textContent = t.errReq; $("err").hidden = false; return; }
  $("err").hidden = true;
  const btn = $("submitBtn"); btn.disabled = true; btn.textContent = t.saving;
  try {
    if (!sb) throw new Error("no_client");
    const { data, error } = await sb.rpc("create_request", { p: d });
    if (error) {
      if (String(error.message).includes("too_many_requests")) { $("err").textContent = t.errMany; $("err").hidden = false; return; }
      throw error;
    }
    last = { data: d, code: data.code, token: data.token };
    U.rememberRequest(data.code, data.token);
    $("resCode").textContent = data.code;
    $("trackBtn").href = U.trackUrl(data.code, data.token);
    $("waBtn").href = U.waLink(A.WHATSAPP_NUMBER, buildMessage(d, data.code, data.token));
    $("form").hidden = true; $("result").hidden = false; $("stepServices").hidden = true;
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch(err) {
    console.error(err);
    const text = buildMessage(d);
    $("fallbackMsg").textContent = text;
    $("waFallback").href = U.waLink(A.WHATSAPP_NUMBER, text);
    $("fallback").hidden = false;
  } finally { btn.disabled = false; btn.textContent = t.submit; }
});
$("copyLink").onclick = () => last && U.copy(U.trackUrl(last.code, last.token), $("copyLink"), T[lang].copied);
$("again").onclick = () => { $("form").reset(); selected = ""; last = null; $("result").hidden = true; $("fallback").hidden = true; $("form").hidden = false; $("stepServices").hidden = false; render(); };

function renderReviews(){
  if (!reviews.length) { $("reviewsSec").hidden = true; return; }
  $("reviewsSec").hidden = false;
  $("reviews").replaceChildren(...reviews.map(r => h("div", {class:"review"},
    h("span", {class:"stars-static", "aria-label": r.rating + "/5"}, "★".repeat(r.rating) + "☆".repeat(5 - r.rating)),
    h("p", null, r.review), h("small", null, `${r.name} · ${U.service(r.service, lang)}`))));
}
async function loadReviews(){
  if (!sb) return;
  try { const { data } = await sb.rpc("get_reviews"); reviews = Array.isArray(data) ? data : []; renderReviews(); } catch(e){}
}
render(); loadReviews();
</script>
</body>
</html>
