<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document · Assistance Tech Wifi</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--ink:#14202b;--muted:#5a6b78;--line:#d7dee3;--accent:#0b7a8a;--bg:#eef2f4;
  --display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.bar{position:sticky;top:0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:12px;z-index:5}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 18px;font:700 .95rem var(--body);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.sheet{max-width:820px;margin:20px auto;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 14px rgba(20,32,43,.08);padding:38px 40px;min-height:60vh}
@media (max-width:560px){.sheet{padding:24px 20px;margin:12px}}
.top{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
.biz{display:flex;flex-direction:column;gap:3px;min-width:0}
.biz-name{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:1.3rem}
.bars{display:flex;align-items:flex-end;gap:3px;height:22px}
.bars i{display:block;width:5px;background:var(--accent);border-radius:1px}
.bars i:nth-child(1){height:30%}.bars i:nth-child(2){height:55%}.bars i:nth-child(3){height:80%}.bars i:nth-child(4){height:100%;background:#c9820a}
.biz small{color:var(--muted);font-size:.84rem}
.doc-title{text-align:right}
.doc-title h1{font-family:var(--display);font-size:2rem;margin:0;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.doc-num{font:500 .9rem var(--mono);color:var(--muted);margin-top:4px}
.badge{display:inline-block;margin-top:8px;border-radius:999px;padding:3px 12px;font:700 .78rem var(--body);text-transform:uppercase;letter-spacing:.04em}
.b-pending{background:#fbf0dc;color:#9a6407}.b-paid{background:#e3f4ea;color:#1c8c4e}.b-cancelled{background:#fbe5e2;color:#c0392b}
.meta{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin:28px 0 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0}
.meta .blk{display:flex;flex-direction:column;gap:3px;min-width:0}
.meta .lbl{font:500 .7rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.meta .val{font-weight:700}
table{width:100%;border-collapse:collapse;margin:8px 0}
th{text-align:left;font:500 .72rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid var(--line);padding:8px 8px}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.totals{margin-left:auto;margin-top:16px;width:min(320px,100%);display:flex;flex-direction:column;gap:6px}
.totals .r{display:flex;justify-content:space-between;gap:16px}
.totals .r.big{border-top:2px solid var(--ink);padding-top:10px;margin-top:4px;font-family:var(--display);font-weight:700;font-size:1.25rem}
.totals .r.due{color:var(--accent);font-weight:700}
.amount-lead{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:18px 0}
.notes{margin-top:26px;color:var(--muted);font-size:.9rem;white-space:pre-wrap}
.foot{margin-top:34px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:.84rem;text-align:center;white-space:pre-wrap}
.msg{max-width:560px;margin:60px auto;text-align:center;color:var(--muted);padding:0 20px}
.msg a{color:var(--accent)}
@media print{
  .bar{display:none}
  body{background:#fff}
  .sheet{box-shadow:none;border:0;margin:0;max-width:none;padding:0}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <button class="btn primary" onclick="window.print()">🖨️ Print / Save as PDF</button>
  <button class="btn" onclick="window.close()">Close</button>
</div>
<div id="root"><div class="msg">Loading…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.76.1/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const A = APP, $ = U.$, h = U.h;
const sb = U.client(true); // shares the admin session saved by the dashboard (same origin)
const params = new URLSearchParams(location.search);
const type = params.get("type") === "receipt" ? "receipt" : "invoice";
const id = params.get("id");
document.title = (type === "receipt" ? "Receipt" : "Invoice") + " · " + A.BUSINESS_NAME;

function fail(msg){ $("root").replaceChildren(h("div", {class:"msg"}, msg, h("div", {style:"margin-top:14px"}, h("a", {href:"admin.html"}, "Open the dashboard")))); }

function bizHeader(s){
  const lines = [];
  if (s && s.biz_address) lines.push(h("small", null, s.biz_address));
  lines.push(h("small", null, "WhatsApp " + A.WHATSAPP_DISPLAY));
  if (s && s.biz_email) lines.push(h("small", null, s.biz_email));
  if (s && s.biz_taxid) lines.push(h("small", null, "NIF: " + s.biz_taxid));
  return h("div", {class:"biz"},
    h("div", {class:"biz-name"}, h("span", {class:"bars"}, h("i"), h("i"), h("i"), h("i")), A.BUSINESS_NAME),
    ...lines);
}
function metaBlock(lbl, val){ return h("div", {class:"blk"}, h("div", {class:"lbl"}, lbl), h("div", {class:"val"}, val || "—")); }

async function render(){
  if (!sb) return fail("Could not load. Check your internet connection.");
  if (!id) return fail("No document selected.");
  const { data: sess } = await sb.auth.getSession();
  if (!sess.session) return fail("Please log in to the dashboard first, then reopen this link.");
  const setg = await sb.from("settings").select("biz_address,biz_email,biz_taxid,invoice_footer").eq("id",1).maybeSingle();
  const s = setg.data || {};

  if (type === "invoice") {
    const inv = await sb.from("invoices").select("*").eq("id", id).maybeSingle();
    if (inv.error || !inv.data) return fail("Invoice not found, or you don't have access.");
    const r = inv.data;
    const items = (await sb.from("invoice_items").select("*").eq("invoice_id", id).order("pos")).data || [];
    const paid = ((await sb.from("payments").select("amount").eq("invoice_id", id)).data || []).reduce((t,p) => t + Number(p.amount||0), 0);
    const statusLabel = r.status === "paid" ? "Paid" : r.status === "cancelled" ? "Cancelled" : "Pending";
    const rowsEl = items.map((it, i) => h("tr", null,
      h("td", {class:"num"}, String(i+1)), h("td", null, it.description),
      h("td", {class:"num"}, Number(it.qty).toLocaleString("fr-FR")),
      h("td", {class:"num"}, U.money(it.unit_price)),
      h("td", {class:"num"}, U.money(Math.round(Number(it.qty)*Number(it.unit_price))))));
    const balance = Math.max(0, Number(r.total) - paid);
    $("root").replaceChildren(h("div", {class:"sheet"},
      h("div", {class:"top"}, bizHeader(s),
        h("div", {class:"doc-title"}, h("h1", null, "Invoice"), h("div", {class:"doc-num"}, r.number),
          h("div", null, h("span", {class:"badge b-" + r.status}, statusLabel)))),
      h("div", {class:"meta"},
        metaBlock("Issue date", U.date(r.issue_date)),
        metaBlock("Due date", U.date(r.due_date)),
        h("div", {class:"blk"}, h("div", {class:"lbl"}, "Billed to"), h("div", {class:"val"}, r.customer_name), r.customer_phone ? h("small", {style:"color:var(--muted)"}, r.customer_phone) : null)),
      h("table", null,
        h("thead", null, h("tr", null, h("th", {class:"num"}, "#"), h("th", null, "Description"), h("th", {class:"num"}, "Qty"), h("th", {class:"num"}, "Unit price"), h("th", {class:"num"}, "Amount"))),
        h("tbody", null, ...rowsEl)),
      h("div", {class:"totals"},
        h("div", {class:"r"}, h("span", null, "Subtotal"), h("span", null, U.money(r.total))),
        h("div", {class:"r big"}, h("span", null, "Total"), h("span", null, U.money(r.total))),
        paid > 0 ? h("div", {class:"r"}, h("span", null, "Paid"), h("span", null, "− " + U.money(paid))) : null,
        paid > 0 ? h("div", {class:"r due"}, h("span", null, "Balance due"), h("span", null, U.money(balance))) : null),
      r.notes ? h("div", {class:"notes"}, "Notes: " + r.notes) : null,
      h("div", {class:"foot"}, s.invoice_footer || "Thank you for your business.")));
  } else {
    const pay = await sb.from("payments").select("*").eq("id", id).maybeSingle();
    if (pay.error || !pay.data) return fail("Receipt not found, or you don't have access.");
    const p = pay.data;
    let invNum = null;
    if (p.invoice_id) { const iv = await sb.from("invoices").select("number").eq("id", p.invoice_id).maybeSingle(); invNum = iv.data && iv.data.number; }
    $("root").replaceChildren(h("div", {class:"sheet"},
      h("div", {class:"top"}, bizHeader(s),
        h("div", {class:"doc-title"}, h("h1", null, "Receipt"), h("div", {class:"doc-num"}, p.number),
          h("div", null, h("span", {class:"badge b-paid"}, "Paid")))),
      h("div", {class:"meta"},
        metaBlock("Date", U.date(p.paid_date)),
        metaBlock("Method", p.method),
        h("div", {class:"blk"}, h("div", {class:"lbl"}, "Received from"), h("div", {class:"val"}, p.customer_name || "—"), p.customer_phone ? h("small", {style:"color:var(--muted)"}, p.customer_phone) : null)),
      h("div", {class:"amount-lead"}, "Amount received: " + U.money(p.amount)),
      h("table", null,
        h("tbody", null,
          p.pay_for ? h("tr", null, h("td", {style:"color:var(--muted);width:40%"}, "Payment for"), h("td", null, p.pay_for)) : null,
          invNum ? h("tr", null, h("td", {style:"color:var(--muted)"}, "Invoice"), h("td", null, invNum)) : null,
          p.note ? h("tr", null, h("td", {style:"color:var(--muted)"}, "Note"), h("td", null, p.note)) : null)),
      h("div", {class:"foot"}, s.invoice_footer || "Thank you for your business.")));
  }
  $("bar").hidden = false;
}
render().catch(e => { console.error(e); fail("Something went wrong loading this document."); });
</script>
</body>
</html>
